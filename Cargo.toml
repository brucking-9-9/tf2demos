[package]
name = "tf2demos"
version = "0.1.0"
edition = "2024"
description = "Organize Team Fortress 2 demos recorded by the built-in ds_* demo support"
license = "MIT"

[[bin]]
name = "tf2demos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "default_fonts"] }
